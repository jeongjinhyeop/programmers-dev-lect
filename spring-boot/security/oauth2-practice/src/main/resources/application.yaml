spring:
  application:
    name: oauth2-practice

  datasource:
    url: jdbc:mysql://localhost:3306/java_basic?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: a167d168d89ef99e5523c6a8b166f392
            client-secret: DZXVFXX0CXdOVof7fVmLVJekfbPVcLeD
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: kakao
            # 동의항목(카카오 콘솔)
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize # 인가 페이지
            token-uri: https://kauth.kakao.com/oauth/token # 코드 -> 토큰 교환(access token으로 바꾸는 곳. 브라우저를 거치치 않고 "우리 서버 -> 카카오 서버"가 직접 통신)
            user-info-uri: https://kapi.kakao.com/v2/user/me # 사용자 정보 조회 : 이 응답이 KakaoUserInfo가 파싱하는 바로 그 맵(attributes)이 된다.
            # nameAttributeKey로 흘러들어가 providerId 추출의 기준이 된다. -> user-info 응답에서 "이 사용자를 유일하게 식별하는 값"이 담긴 최상위 필드 이름
            user-name-attribute: id

jwt:
  issuer: test@naver.com
  secret_key: 4ukvJcQYxNY1X/9Ep4VsnXWhjkV/QzN/plJa24NcOf1pnLB+78OKrBG4LyAVGOHzzdo5sorkBA73Yo0/4urXIg==
  access-token-validity: 2h
  refresh-token-validity: 7d